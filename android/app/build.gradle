plugins { id 'com.android.application' }

android {
    namespace 'edu.nju.homework'
    compileSdk 35

    defaultConfig {
        applicationId 'edu.nju.homework'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '0.2.2'
        testInstrumentationRunner 'edu.nju.homework.SmokeRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug { storeFile rootProject.file('../tmp/android-debug.keystore') }
    }
}
